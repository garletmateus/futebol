<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar conta | Resenha Sports</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --blue: #2230ad;
      --blue-dark: #182388;
      --green: #0d7a5f;
      --bg: #eef4f3;
      --text: #122019;
      --muted: #60756d;
      --line: #d8e4df;
      --white: #ffffff;
      --danger: #c62828;
      --success: #087f5b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: "DM Sans", sans-serif;
      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px 16px;
    }

    .cadastro-container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo h1 {
      font-family: "Barlow", sans-serif;
      font-size: 38px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: -1px;
    }

    .logo p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: var(--white);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 12px 35px rgba(18, 32, 25, 0.10);
      border: 1px solid rgba(216, 228, 223, 0.8);
    }

    .card h2 {
      font-family: "Barlow", sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitulo {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 17px;
    }

    .campo label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .campo input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fff;
      color: var(--text);
    }

    .campo input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(34, 48, 173, 0.10);
    }

    .btn-cadastrar {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .btn-cadastrar:hover {
      background: var(--blue-dark);
    }

    .btn-cadastrar:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .mensagem {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .mensagem.erro {
      display: block;
      background: #fdecec;
      color: var(--danger);
      border: 1px solid #f5c2c2;
    }

    .mensagem.sucesso {
      display: block;
      background: #e8f7f1;
      color: var(--success);
      border: 1px solid #b9e5d5;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .login-link a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .voltar {
      text-align: center;
      margin-top: 18px;
    }

    .voltar a {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .voltar a:hover {
      color: var(--blue);
    }

    @media (max-width: 500px) {
      body {
        padding: 20px 12px;
      }

      .card {
        padding: 24px 20px;
      }

      .logo h1 {
        font-size: 34px;
      }

      .card h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <main class="cadastro-container">

    <div class="logo">
      <h1>RESENHA SPORTS</h1>
      <p>Qualidade e preço justo</p>
    </div>

    <section class="card">

      <h2>Criar sua conta</h2>

      <p class="subtitulo">
        Cadastre-se para acompanhar seus pedidos.
      </p>

      <div id="mensagem" class="mensagem"></div>

      <form id="formCadastro">

        <div class="campo">
          <label for="nome">Nome completo</label>

          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            autocomplete="name"
            required
          >
        </div>

        <div class="campo">
          <label for="email">E-mail</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>

          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(46) 99999-9999"
            autocomplete="tel"
          >
        </div>

        <div class="campo">
          <label for="senha">Senha</label>

          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Mínimo de 6 caracteres"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="campo">
          <label for="confirmarSenha">Confirmar senha</label>

          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <button
          type="submit"
          class="btn-cadastrar"
          id="btnCadastrar"
        >
          Criar minha conta
        </button>

      </form>

      <div class="login-link">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </div>

      <div class="voltar">
        <a href="index.html">← Voltar para a loja</a>
      </div>

    </section>

  </main>


  <script>
    const formCadastro = document.getElementById("formCadastro");
    const mensagem = document.getElementById("mensagem");
    const btnCadastrar = document.getElementById("btnCadastrar");

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
    }

    formCadastro.addEventListener("submit", async function (event) {

      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const telefone = document.getElementById("telefone").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;

      mensagem.className = "mensagem";
      mensagem.textContent = "";

      if (!nome || !email || !senha || !confirmarSenha) {
        mostrarMensagem(
          "Preencha todos os campos obrigatórios.",
          "erro"
        );
        return;
      }

      if (senha.length < 6) {
        mostrarMensagem(
          "A senha deve ter pelo menos 6 caracteres.",
          "erro"
        );
        return;
      }

      if (senha !== confirmarSenha) {
        mostrarMensagem(
          "As senhas não são iguais.",
          "erro"
        );
        return;
      }

      btnCadastrar.disabled = true;
      btnCadastrar.textContent = "Cadastrando...";

      try {

        const resposta = await fetch("/api/clientes/cadastro", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            nome: nome,
            email: email,
            senha: senha,
            telefone: telefone
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.mensagem || "Não foi possível realizar o cadastro."
          );
        }

        mostrarMensagem(
          "Cadastro realizado com sucesso! Você já pode entrar.",
          "sucesso"
        );

        formCadastro.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (erro) {

        console.error("Erro no cadastro:", erro);

        mostrarMensagem(
          erro.message || "Erro ao realizar cadastro.",
          "erro"
        );

      } finally {

        btnCadastrar.disabled = false;
        btnCadastrar.textContent = "Criar minha conta";

      }

    });
  </script>

</body>

</html>
